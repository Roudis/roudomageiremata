name: CI

# Runs the same checks as `npm run check` on every pull request and on pushes
# to non-main branches, so broken code or recipe data is caught before it
# reaches main (which auto-deploys to GitHub Pages).
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate recipe data
        run: npm run validate:data

      - name: Build static site
        run: npm run build
